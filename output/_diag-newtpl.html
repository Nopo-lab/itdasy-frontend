<!doctype html><html><body><script>/* 사진 편집기 — 템플릿 안전 텍스트/이미지 helper (PR-S1 2026-06-06)

   목표: 사용자가 문구를 바꿔도 레이아웃이 안 깨지게.
   - 한글/영문/숫자 줄바꿈
   - maxLines 초과 시 fontSize 축소 → minFontSize 이하이면 말줄임
   - 가격 포맷/파싱, 가격표 row, 이미지 슬롯 cover/contain

   외부 노출: window.PhotoEditorTemplateFitText
*/
(function () {
  'use strict';
  if (window.PhotoEditorTemplateFitText) return;

  // ── 줄바꿈 (한글=글자단위, 영문=단어우선) ────────────────
  function wrapText(ctx, text, maxWidth, style) {
    style = style || {};
    if (style.font) ctx.font = style.font;
    const src = String(text == null ? '' : text);
    const lines = [];
    src.split('\n').forEach((para) => {
      if (para === '') { lines.push(''); return; }
      let line = '';
      for (let i = 0; i < para.length; i++) {
        const ch = para[i];
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line !== '') {
          // 영문 단어 중간이면 마지막 공백에서 끊기
          const sp = line.lastIndexOf(' ');
          if (sp > 0 && /[A-Za-z0-9]/.test(ch)) {
            lines.push(line.slice(0, sp));
            line = line.slice(sp + 1) + ch;
          } else {
            lines.push(line);
            line = ch;
          }
        } else {
          line = test;
        }
      }
      lines.push(line);
    });
    return lines;
  }

  function _fontStr(style, size) {
    const weight = style.weight || 600;
    const family = style.fontFamily || 'Pretendard, "Noto Sans KR", sans-serif';
    return `${weight} ${size}px ${family}`;
  }

  // box 에 맞춰 fontSize 자동 축소 + maxLines 초과 시 말줄임. 그린 뒤 결과 반환.
  function drawFitText(ctx, text, box, style) {
    style = style || {};
    const maxFont = style.maxFontSize || 48;
    const minFont = style.minFontSize || 18;
    const maxLines = style.maxLines || 3;
    const lhRatio = style.lineHeight || 1.28;
    let size = maxFont, lines = [];
    for (; size >= minFont; size -= 2) {
      ctx.font = _fontStr(style, size);
      lines = wrapText(ctx, text, box.w, { font: ctx.font });
      if (lines.length <= maxLines) break;
    }
    let truncated = false;
    if (lines.length > maxLines) {
      lines = lines.slice(0, maxLines);
      let last = lines[maxLines - 1];
      while (last.length && ctx.measureText(last + '…').width > box.w) last = last.slice(0, -1);
      lines[maxLines - 1] = last + '…';
      truncated = true;
    }
    ctx.font = _fontStr(style, size);
    ctx.fillStyle = style.color || '#111';
    ctx.textAlign = style.align || 'left';
    ctx.textBaseline = 'top';
    const lh = size * lhRatio;
    const totalH = lh * lines.length;
    let y = box.y;
    if (style.valign === 'middle') y = box.y + (box.h - totalH) / 2;
    else if (style.valign === 'bottom') y = box.y + (box.h - totalH);
    const x = style.align === 'center' ? box.x + box.w / 2 : (style.align === 'right' ? box.x + box.w : box.x);
    lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lh));
    return { fontSize: size, lines, truncated, height: totalH };
  }

  // ── 가격 ────────────────────────────────────────────────
  //   80000 → 80,000원 · 8만원 → 80,000원 · 80,000원 유지 · 150000 → 150,000원
  function formatPrice(value) {
    if (value == null || value === '') return '';
    let s = String(value).trim();
    let won = 0;
    const manMatch = s.match(/(\d+(?:\.\d+)?)\s*만/);
    if (manMatch) {
      won = Math.round(parseFloat(manMatch[1]) * 10000);
      const rest = s.replace(/\d+(?:\.\d+)?\s*만\s*원?/, '');
      const tail = (rest.match(/(\d[\d,]*)\s*원?/) || [])[1];
      if (tail) won += parseInt(tail.replace(/,/g, ''), 10) || 0;
    } else {
      const digits = s.replace(/[^\d]/g, '');
      if (!digits) return s;   // 숫자 없으면 원문 유지
      won = parseInt(digits, 10);
    }
    if (!isFinite(won) || won <= 0) return s;
    return won.toLocaleString('en-US') + '원';
  }

  // "물광케어 8만원" / "진정관리 120000" / "리프팅관리 150,000원" → [{name, price}]
  function parseServicePrices(text) {
    const out = [];
    String(text == null ? '' : text).split('\n').forEach((raw) => {
      const line = raw.trim();
      if (!line) return;
      // 구분자(| , 탭, 다중공백) 또는 끝의 가격 토큰 분리
      let m = line.split(/\s*[|\t]\s*/);
      if (m.length >= 2) {
        out.push({ name: m[0].trim(), price: formatPrice(m.slice(1).join(' ')) });
        return;
      }
      const pm = line.match(/^(.*?)[\s]+([\d][\d,]*\s*(?:만\s*)?원?|\d+\s*만\s*원?)\s*$/);
      if (pm) out.push({ name: pm[1].trim(), price: formatPrice(pm[2]) });
      else out.push({ name: line, price: '' });
    });
    return out;
  }

  // rows: [{name, desc?, price}] — box 안에 균등 배치. name 좌, price 우.
  function drawPriceRows(ctx, rows, box, style) {
    style = style || {};
    const list = (rows || []).slice(0, style.maxRows || 6);
    if (!list.length) return;
    const gap = box.h / list.length;
    const fs = Math.min(style.fontSize || 30, gap * 0.5);
    list.forEach((row, i) => {
      const cy = box.y + gap * i + gap / 2;
      ctx.textBaseline = 'middle';
      ctx.font = _fontStr({ weight: 600, fontFamily: style.fontFamily }, fs);
      ctx.fillStyle = style.nameColor || '#222';
      ctx.textAlign = 'left';
      ctx.fillText(row.name || '', box.x, cy);
      if (row.desc) {
        ctx.font = _fontStr({ weight: 500, fontFamily: style.fontFamily }, fs * 0.7);
        ctx.fillStyle = style.descColor || '#999';
        ctx.fillText(row.desc, box.x, cy + fs * 0.7);
      }
      if (row.price) {
        ctx.font = _fontStr({ weight: 700, fontFamily: style.fontFamily }, fs);
        ctx.fillStyle = style.priceColor || '#7c3aed';
        ctx.textAlign = 'right';
        ctx.fillText(row.price, box.x + box.w, cy);
      }
    });
  }

  // ── 이미지 슬롯 (cover/contain + focal) ────────────────
  function drawImageSlot(ctx, image, frame, options) {
    if (!image) return;
    options = options || {};
    const iw = image.naturalWidth || image.width, ih = image.naturalHeight || image.height;
    if (!iw || !ih) return;
    const fit = options.fit || 'cover';
    const focal = options.focal || { x: 0.5, y: 0.5 };
    ctx.save();
    if (options.radius) {
      _roundRect(ctx, frame.x, frame.y, frame.w, frame.h, options.radius);
      ctx.clip();
    }
    if (fit === 'contain') {
      const scale = Math.min(frame.w / iw, frame.h / ih);
      const dw = iw * scale, dh = ih * scale;
      ctx.drawImage(image, frame.x + (frame.w - dw) / 2, frame.y + (frame.h - dh) / 2, dw, dh);
    } else {
      const sAR = iw / ih, dAR = frame.w / frame.h;
      let sw, sh;
      if (sAR > dAR) { sh = ih; sw = sh * dAR; } else { sw = iw; sh = sw / dAR; }
      const sx = Math.max(0, Math.min(iw - sw, (iw - sw) * (focal.x * 2)));
      const sy = Math.max(0, Math.min(ih - sh, (ih - sh) * (focal.y * 2)));
      ctx.drawImage(image, sx, sy, sw, sh, frame.x, frame.y, frame.w, frame.h);
    }
    ctx.restore();
  }

  function _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  window.PhotoEditorTemplateFitText = {
    wrapText, drawFitText, formatPrice, parseServicePrices, drawPriceRows, drawImageSlot,
  };
})();

;
/* 사진 편집기 — 템플릿 editable slot 메타데이터 (PR-S1 2026-06-06)

   목표: 템플릿마다 "사용자가 바꿔도 되는 슬롯"을 선언적으로 정의 + 안전한 기본값 생성.
   - UI(편집 시트)는 S2에서. 이번 PR은 기반 구조(슬롯 정의 + 기본값 + 병합)만.
   - 종류: price | review | before_after | generic
   - 3종(price/review/before_after) 샘플 메타만 충실히, 나머지는 generic fallback.

   외부 노출: window.PhotoEditorTemplateSlots
     getSlots(templateId, templateData)              → slot 정의 배열
     getDefaultValues(templateId, templateData, ctx) → { key: value } 기본값
     mergeValues(slots, savedValues)                 → 저장값 우선 병합
     inferTemplateKind(templateId, templateData)     → 'price'|'review'|'before_after'|'generic'
*/
(function () {
  'use strict';
  if (window.PhotoEditorTemplateSlots) return;

  // ── 슬롯 정의 (kind 별) ─────────────────────────────────
  //   type: text | textarea | list | image  ·  role: image 슬롯 용도
  const SLOTS = {
    price: [
      { key: 'shop_name', type: 'text', label: '샵 이름', max: 24 },
      { key: 'headline', type: 'text', label: '제목', max: 20, maxLines: 2 },
      { key: 'subtitle', type: 'textarea', label: '부제', max: 60, maxLines: 2 },
      { key: 'services', type: 'list', label: '시술·가격', item: ['name', 'desc', 'price'] },
      { key: 'cta', type: 'text', label: '행동 유도', max: 16 },
      { key: 'phone', type: 'text', label: '연락처', max: 20 },
      { key: 'main_photo', type: 'image', label: '배경 사진', role: 'main' },
    ],
    review: [
      { key: 'shop_name', type: 'text', label: '샵 이름', max: 24 },
      { key: 'headline', type: 'text', label: '제목', max: 20, maxLines: 2 },
      { key: 'subtitle', type: 'textarea', label: '부제', max: 60, maxLines: 2 },
      { key: 'review_text', type: 'textarea', label: '후기 문구', max: 120, maxLines: 4 },
      { key: 'customer_label', type: 'text', label: '작성자', max: 20 },
      { key: 'cta', type: 'text', label: '행동 유도', max: 16 },
      { key: 'main_photo', type: 'image', label: '배경 사진', role: 'main' },
    ],
    before_after: [
      { key: 'shop_name', type: 'text', label: '샵 이름', max: 24 },
      { key: 'headline', type: 'text', label: '제목', max: 20, maxLines: 2 },
      { key: 'subtitle', type: 'textarea', label: '부제', max: 60, maxLines: 2 },
      { key: 'before_label', type: 'text', label: 'Before 라벨', max: 12 },
      { key: 'after_label', type: 'text', label: 'After 라벨', max: 12 },
      { key: 'before_caption', type: 'text', label: 'Before 설명', max: 24 },
      { key: 'after_caption', type: 'text', label: 'After 설명', max: 24 },
      { key: 'cta', type: 'text', label: '행동 유도', max: 16 },
      { key: 'before_photo', type: 'image', label: '시술 전 사진', role: 'before' },
      { key: 'after_photo', type: 'image', label: '시술 후 사진', role: 'after' },
    ],
    generic: [
      { key: 'shop_name', type: 'text', label: '샵 이름', max: 24 },
      { key: 'headline', type: 'text', label: '제목', max: 20, maxLines: 2 },
      { key: 'subtitle', type: 'textarea', label: '부제', max: 60, maxLines: 2 },
      { key: 'cta', type: 'text', label: '행동 유도', max: 16 },
      { key: 'main_photo', type: 'image', label: '배경 사진', role: 'main' },
    ],
  };

  function inferTemplateKind(templateId, templateData) {
    const id = String(templateId || '');
    const d = templateData || {};
    if (/^ba-|before|after|전후|2split|3process|4grid/.test(id) || d.purpose === 'before_after' || d.cat === 'ba') return 'before_after';
    if (d.purpose === 'price' || d.cat === 'price' || /price|가격|menu|메뉴/.test(id)) return 'price';
    if (d.purpose === 'review' || /review|후기/.test(id)) return 'review';
    return 'generic';
  }

  function getSlots(templateId, templateData) {
    const kind = inferTemplateKind(templateId, templateData);
    const base = SLOTS[kind] || SLOTS.generic;
    // [WM] 템플릿별 추가 편집 슬롯(extraSlots) — 선언한 템플릿에만 append(중복 key 제외).
    //   다른 템플릿은 extraSlots 없음 → base 그대로 반환(무회귀).
    const extra = templateData && Array.isArray(templateData.extraSlots) ? templateData.extraSlots : null;
    if (!extra || !extra.length) return base;
    const have = {};
    base.forEach((s) => { have[s.key] = 1; });
    const merged = base.slice();
    extra.forEach((s) => { if (s && s.key && !have[s.key]) { have[s.key] = 1; merged.push(s); } });
    return merged;
  }

  // ── kind 별 기본값 ──────────────────────────────────────
  function _shopName(ctx) {
    if (ctx && ctx.shopName) return ctx.shopName;
    try {
      const bk = window.BrandKit && window.BrandKit.get && window.BrandKit.get();
      if (bk && bk.shopName) return bk.shopName;
    } catch (_e) { /* ignore */ }
    return '우리 살롱';
  }

  // [HF1] badge·origPrice 는 optional — v3 렌더(_drawV3Price)만 표시, 기존 렌더·edit-sheet 는 무시(무회귀).
  //   [정합성] 업종 중립 placeholder — 네일/헤어/속눈썹/피부 어디서 가격표를 열어도 '남의 업종' 시술명이
  //   채워지지 않게(예전 '물광케어/여드름케어' 는 피부 전용이라 네일샵에 어색). 사용자가 바로 교체하는 예시값.
  const PRICE_SAMPLE = [
    { name: '시그니처 메뉴', desc: '대표 인기 시술', price: '80,000원', origPrice: '100,000원', badge: 'BEST' },
    { name: '베이직 메뉴', desc: '기본 시술', price: '50,000원' },
    { name: '프리미엄 메뉴', desc: '집중 케어', price: '120,000원', origPrice: '150,000원', badge: 'EVENT' },
    { name: '데일리 메뉴', desc: '간편 시술', price: '40,000원' },
  ];

  function getDefaultValues(templateId, templateData, ctx) {
    const kind = inferTemplateKind(templateId, templateData);
    const shop = _shopName(ctx);
    const base = { shop_name: shop, cta: '예약 문의' };
    let out;
    if (kind === 'price') {
      out = Object.assign(base, {
        headline: '시술 가격표',
        subtitle: '아름다움을 위한 특별한 관리, 합리적인 가격으로 만나보세요.',
        services: PRICE_SAMPLE.map(s => Object.assign({}, s)),
        phone: (ctx && ctx.phone) || '',
      });
    } else if (kind === 'review') {
      out = Object.assign(base, {
        headline: '고객님의 진심 후기',
        subtitle: '시술 후 달라진 변화를 확인해보세요.',
        // [정합성] 업종 중립 후기 — 피부 전용 표현('피부 결/화장 잘 먹어요') 제거.
        review_text: '처음부터 끝까지 꼼꼼하게 신경 써주셔서 결과가 정말 마음에 들어요. 다음에도 또 받으러 올게요 :)',
        customer_label: (ctx && ctx.customerName) ? (ctx.customerName + ' 고객님') : '30대 / 단골 고객님',
        service_name: '',                 // [HF1] optional — v3 렌더만 작은 라벨로 표시(업종 중립 위해 기본 비움)
        date: '',                         // [HF1] optional
        cta: '상담 예약하기',
      });
    } else if (kind === 'before_after') {
      out = Object.assign(base, {
        headline: '시술 전후',
        subtitle: '한눈에 비교해보세요. 달라진 아름다움의 차이',
        before_label: 'BEFORE',
        after_label: 'AFTER',
        // [정합성] 업종 중립 캡션 — 피부 가정('칙칙한 피부 톤') 제거. BEFORE/AFTER 라벨은 위에 유지.
        before_caption: '시술 전',
        after_caption: '시술 후',
        cta: '상담 예약하기',
      });
    } else {
      // generic — 기존 렌더 무회귀: headline 은 템플릿 고유 문구 유지
      out = Object.assign(base, {
        headline: (templateData && (templateData.prefillText || templateData.label)) || '오늘의 시술',
        subtitle: '',
      });
    }
    // [BP-3] 템플릿 고유 defaultCopy 우선 — 현재 beauty 팩 엔트리만 보유(TOP5/legacy 는 defaultCopy 없음 → 무영향).
    if (templateData && templateData.defaultCopy) {
      Object.assign(out, templateData.defaultCopy);
      // [정합성] 데모 카피의 샵 이름이 실제 사용자 샵명을 덮지 않게 — 사용자 BrandKit/ctx 값이 우선.
      //   ('에끌레르 에스테틱'·'루미네일' 같은 레퍼런스 데모명이 모든 사용자 카드에 박히던 문제.)
      out.shop_name = _shopName(ctx);
    }
    return out;
  }

  // 저장값 우선 병합. slots 에 정의된 key 만 반영(이상 key 무시).
  function mergeValues(slots, savedValues) {
    const out = {};
    const saved = savedValues || {};
    (slots || []).forEach((slot) => {
      if (slot.type === 'image') return;   // imageSlots 는 별도 관리
      if (Object.prototype.hasOwnProperty.call(saved, slot.key)) out[slot.key] = saved[slot.key];
    });
    return out;
  }

  window.PhotoEditorTemplateSlots = { getSlots, getDefaultValues, mergeValues, inferTemplateKind };
})();

;
/* 뷰티 템플릿 팩 — 데이터 전용 (BP-2, 2026-06-09)

   업로드 레퍼런스를 editable 캔버스 템플릿으로 재현하기 위한 TOP3 메타데이터.
   - 이 파일은 "데이터"만 소유한다(렌더 X / 연결 X).
   - market-data.js 가 window.PhotoEditorBeautyPackData.TEMPLATES 를 읽어 "조회(lookupById/v3ById)"
     리스트에만 합류시킨다(갤러리 visibleTemplates 에는 미노출 = apply-only).
   - 렌더는 template-renderer-beauty-pack.js(window.PhotoEditorBeautyPack)가, 매핑은 premium-templates META 가 담당.
   - 좌표/카피 고퀄 튜닝은 BP-3. 현재(BP-2)는 skeleton 검증용 메타데이터.

   엔트리 형태(= V3_TOP5 와 동일 키 + 선택 키):
     { id, cat, tier, label, kind, industry, accent, prefillText, palette{bg,ink,sub,accent,line,badge},
       ratio, defaultCopy{...}(BP-3에서 사용, 현재 inert), previewMeta{decor[],photoSlots[]} }

   참고: apply 시 slotValues 는 template-slots.getDefaultValues(kind 기반)에서 생성된다(defaultCopy 미사용).
        그래서 BP-2 에서는 defaultCopy 가 inert 여도 가격/후기/전후 기본 카피로 skeleton 이 의미있게 그려진다.
*/
(function () {
  'use strict';
  if (window.PhotoEditorBeautyPackData) return;

  // [TPL-2] 업종/용도 태그 — id·cat·label 키워드로 자동 도출(55종 수동태깅 대신 견고).
  //   industry: nail/hair/lash/brow/skin/makeup/common · purpose: before_after/review/price/event/retouch/booking/story/reel_cover/portfolio/feed/promo
  const INDUSTRY_LABEL = { nail: '네일', hair: '헤어', lash: '속눈썹', brow: '눈썹', skin: '피부', makeup: '메이크업', common: '공통' };
  const PURPOSE_LABEL = {
    before_after: '시술 전후', review: '후기', price: '가격표', event: '이벤트', retouch: '리터치',
    booking: '예약', story: '스토리', reel_cover: '릴스', portfolio: '포트폴리오', feed: '피드', promo: '홍보',
  };
  function industryOf(t) {
    const s = (t.id + ' ' + (t.label || '') + ' ' + (t.prefillText || ''));
    if (/nail|네일|손톱|젤/.test(s)) return 'nail';
    if (/hair|헤어|머리|염색|펌|컷/.test(s)) return 'hair';
    if (/lash|eyelash|속눈썹|연장/.test(s)) return 'lash';
    if (/brow|눈썹/.test(s)) return 'brow';
    if (/skin|facial|피부|결|wax|왁싱/.test(s)) return 'skin';
    if (/makeup|메이크업|화장/.test(s)) return 'makeup';
    return 'common';
  }
  function purposeOf(t) {
    const id = t.id, cat = t.cat, s = (id + ' ' + (t.label || '') + ' ' + (t.prefillText || ''));
    if (/^ba-|before|after|전후|compare|2split|3process|4grid/.test(id)) return 'before_after';
    if (/review|후기|testimonial/.test(s)) return 'review';
    if (/price|가격|menu|메뉴/.test(s)) return 'price';
    if (/event|이벤트|sale|할인|discount|gift|증정|deadline|마감|member|회원|newcomer|신규/.test(s)) return 'event';
    if (/retouch|리터치|revisit|rebook|재방문/.test(s)) return 'retouch';
    if (cat === 'card' || /명함|booking|예약|attend|출석|qa|q&a/.test(s)) return 'booking';
    if (cat === 'story') return 'story';
    if (cat === 'reels') return 'reel_cover';
    if (/portfolio|포트폴리오|showcase|자랑/.test(s)) return 'portfolio';
    if (cat === 'feed') return 'feed';
    return 'promo';
  }
  // 모든 템플릿에 industry/purpose 주입(1회).
  TEMPLATES.forEach((t) => { if (!t.industry) t.industry = industryOf(t); if (!t.purpose) t.purpose = purposeOf(t); });

  // 추천 상황 문구(큰 미리보기용).
  function recommendText(t) {
    const ind = INDUSTRY_LABEL[t.industry] || '공통';
    const pur = PURPOSE_LABEL[t.purpose] || '홍보';
    const indPart = t.industry === 'common' ? '' : (ind + ' ');
    return indPart + pur + '에 추천';
  }

  // [TPL-4] Pro 가치문구 — "왜 Pro인지" 1줄. id 구조/카테고리/용도 기반 자동(수동 0).
  //   단순 색변경이 아니라 구조적 고급(다분할/정보내장/타이포)을 강조.
  function proValueText(t) {
    const id = t.id;
    if (/2split|3process|4grid|grid/.test(id)) return '다분할 고급 레이아웃';
    if (/editorial|dark|sage|gold/.test(id)) return '브랜드 무드 고급 디자인';
    if (t.purpose === 'price' || /price|가격/.test(id)) return '가격·메뉴 정보 포함 구성';
    if (t.purpose === 'review') return '후기 강조 레이아웃';
    if (t.purpose === 'event') return '이벤트 홍보 최적화 구성';
    if (t.purpose === 'retouch' || t.purpose === 'booking') return '예약·리터치 안내 구성';
    if (t.cat === 'story' || t.cat === 'reels') return '세로 스토리 홍보 최적화';
    if (t.cat === 'feed') return '피드용 고급 타이포';
    return '브랜드형 고급 홍보 디자인';

  // [TPL-3] 명령 텍스트(+선택 shop_type)로 업종/목적 추론.
  function inferTags(text, shopType) {
    const t = String(text || '');
    let ind = '';
    if (/네일|손톱|아트|글리터|프렌치|젤네일/.test(t)) ind = 'nail';
    else if (/헤어|머리|염색|클리닉|컷|펌(?!.*눈)/.test(t)) ind = 'hair';
    else if (/속눈썹|래쉬|연장|눈썹\s*펌/.test(t)) ind = 'lash';
    else if (/눈썹|브로우/.test(t)) ind = 'brow';
    else if (/피부|스킨|페이셜|피부관리/.test(t)) ind = 'skin';
    else if (/메이크업|화장/.test(t)) ind = 'makeup';
    if (!ind && shopType) {   // 명시 없으면 shop_type 약하게 반영
      const st = String(shopType).toLowerCase();
      if (/nail|네일/.test(st)) ind = 'nail'; else if (/hair|헤어/.test(st)) ind = 'hair';
      else if (/lash|속눈썹/.test(st)) ind = 'lash'; else if (/brow|눈썹/.test(st)) ind = 'brow';
      else if (/skin|피부/.test(st)) ind = 'skin'; else if (/makeup|메이크업/.test(st)) ind = 'makeup';
    }
    let pur = '';
    if (/전후|before|after|비교/.test(t)) pur = 'before_after';
    else if (/스토리|9.?16/.test(t)) pur = 'story';
    else if (/가격|메뉴|금액/.test(t)) pur = 'price';
    else if (/이벤트|할인|프로모션/.test(t)) pur = 'event';
    else if (/후기|리뷰/.test(t)) pur = 'review';
    else if (/리터치|재방문/.test(t)) pur = 'retouch';
    else if (/예약/.test(t)) pur = 'booking';
    else if (/피드|인스타|게시물|4.?5|1.?1/.test(t)) pur = 'feed';
    return { ind, pur };
  }

  // [TPL-3] 업종/목적 기반 템플릿 추천 — 상위 limit개. 점수: 목적일치 3 + 업종일치 2 + 홍보계열 보너스.
  //   명시 업종/목적 우선, 없으면 common + promo/feed/story/before_after fallback.
  function recommendTemplates(text, ctx, limit) {
    limit = limit || 3;
    const st = ctx && (ctx.shopType && ctx.shopType.cat || ctx.shopType);
    const { ind, pur } = inferTags(text, st);
    const PROMO_FALLBACK = { before_after: 4, feed: 3, story: 2, promo: 2, portfolio: 1 };
    const scored = TEMPLATES.map((tpl) => {
      let s = 0;
      if (pur && tpl.purpose === pur) s += 3;
      if (ind && tpl.industry === ind) s += 3;                              // 업종 일치 = 목적과 동등(살롱 특화)
      if (ind && ind !== 'common' && tpl.industry === 'common') s += 0.3;   // 업종 명시 시 공통도 약간
      if (!pur) s += (PROMO_FALLBACK[tpl.purpose] || 0) * 0.5;               // 목적 없으면 홍보계열 우대
      // Free 약간 우선(바로 사용 가능) — 동점 시 Free 먼저
      if (tpl.tier !== 'pro') s += 0.2;
      return { tpl, s };
    }).filter((x) => x.s > 0);
    scored.sort((a, b) => b.s - a.s);
    let picks = scored.slice(0, limit).map((x) => x.tpl);
    // [TPL-3] 업종+목적 둘 다 명시인데 추천에 업종 일치가 0개면, 업종 일치 1개를 끼워넣음(살롱 특화 보장).
    if (ind && ind !== 'common' && pur && !picks.some((t) => t.industry === ind)) {
      const indPick = scored.find((x) => x.tpl.industry === ind);
      if (indPick) { picks = picks.slice(0, limit - 1); picks.unshift(indPick.tpl); }
    }
    if (picks.length < limit) {   // fallback 채움(중복 제외)
      const have = new Set(picks.map((t) => t.id));
      TEMPLATES.forEach((tpl) => { if (picks.length < limit && !have.has(tpl.id) && (PROMO_FALLBACK[tpl.purpose] || tpl.purpose === 'before_after')) { picks.push(tpl); have.add(tpl.id); } });
    }
    return picks.slice(0, limit);
  }

  const PAL = {
    ink: '#111217', paper: '#f8f3eb', cream: '#fffaf2', sage: '#7f9279',
    rose: '#d28b8f', clay: '#b98265', copper: '#c69b63', charcoal: '#24252b',
    line: 'rgba(255,255,255,0.32)', smoke: 'rgba(10,11,15,0.58)',
  };

  function _getTemplates() {
    const base = window.PhotoEditorTemplatesV2;
    return base && Array.isArray(base.TEMPLATES) ? base.TEMPLATES : [];
  }

  function _brandData(tpl) {
    const shop = window.PhotoEditorShopData?.get?.() || {};
    return {
      shop: tpl.shopName || shop.shopName || '잇데이 스튜디오',
      accent: _safeColor(tpl.bg || shop.primaryColor, PAL.copper),
      bg: _safeColor(tpl.bg, PAL.copper),
      price: tpl.price || '',
      review: tpl.review || '',
    };
  }

  function _safeColor(color, fallback) {
    return /^#[0-9a-f]{3,8}$/i.test(color || '') ? color : fallback;
  }

  // [V3-1] palette 헬퍼 — d.palette[key] 있으면 그 색, 없으면 fallback(기존 PAL/하드코딩) → 무회귀.
  //   v3 템플릿만 d.palette 가 채워지고, 기존 템플릿은 null 이라 항상 fallback(기존 동작 동일).
  function _pal(d, key, fallback) {
    const p = d && d.palette;
    return (p && typeof p[key] === 'string' && p[key]) ? p[key] : fallback;
  }

  const SLOT_IMAGE_CACHE = {};

  function _primeImage(src, img) {
    if (src && img) SLOT_IMAGE_CACHE[src] = img;
  }

  function _slotImage(src) {
    if (!src) return null;
    const cached = SLOT_IMAGE_CACHE[src];
    if (cached && (cached.complete || cached.naturalWidth || cached.width)) return cached;
    const img = cached || new Image();
    SLOT_IMAGE_CACHE[src] = img;
    img.onload = () => {
      try { window.PhotoEditor?._internal?.helpers?.scheduleRedraw?.(); } catch (_e) { /* ignore */ }
    };
    img.onerror = () => { delete SLOT_IMAGE_CACHE[src]; };
    if (!cached) img.src = src;
    return (img.complete || img.naturalWidth || img.width) ? img : null;
  }

  // [S4] cover crop + focal(0~1)·zoom(>=1). focal=0.5/zoom=1 → 기존 중앙 cover 와 픽셀 동일(무회귀).
  function _coverCrop(iw, ih, dw, dh, focal, zoom) {
    const fx = (focal && isFinite(focal.x)) ? Math.max(0, Math.min(1, focal.x)) : 0.5;
    const fy = (focal && isFinite(focal.y)) ? Math.max(0, Math.min(1, focal.y)) : 0.5;
    const z = (isFinite(zoom) && zoom > 1) ? zoom : 1;
    const sAR = iw / ih, dAR = dw / dh;
    let sw, sh;
    if (sAR > dAR) { sh = ih; sw = sh * dAR; } else { sw = iw; sh = sw / dAR; }
    sw /= z; sh /= z;
    let sx = (iw - sw) * fx, sy = (ih - sh) * fy;
    sx = Math.max(0, Math.min(iw - sw, sx));
    sy = Math.max(0, Math.min(ih - sh, sy));
    return { sx, sy, sw, sh };
  }

  function _drawCover(ctx, img, x, y, w, h, focal, zoom) {
    const iw = img && (img.naturalWidth || img.width), ih = img && (img.naturalHeight || img.height);
    if (!iw || !ih) return;
    const c = _coverCrop(iw, ih, w, h, focal, zoom);
    ctx.drawImage(img, c.sx, c.sy, c.sw, c.sh, x, y, w, h);
  }

  // [S2.1] 반환값 = 실제로 그렸는지(true/false). v2 hook 이 위임 후 fallback 판단에 사용.
  function _premiumHook(ctx, dw, dh, state) {
    const tpl = state && state.tplV2;
    if (!tpl) return false;
    // [V3-1] found 조회에 v3 TOP5 포함(market-data.V3_TOP5). 기존 경로 우선, 없으면 v3.
    const MD = window.PhotoEditorTemplateMarketData;
    const found = _getTemplates().find(t => t.id === tpl.id) || (MD && MD.v3ById && MD.v3ById(tpl.id)) || null;
    const meta = META[tpl.id];
    if (!found || !meta) return false;
    const b = _brandData(tpl);
    // [S1] editable slot 얕은 연결 — slotValues 있으면 우선, 없으면 기존과 동일(무회귀).
    const sv = (tpl && tpl.slotValues) || {};
    // [V3-1] palette — v3 템플릿이면 found.palette, 기존은 null(→ _pal 가 기존색 반환, 무회귀).
    // [ARCH-1] palettes(테마 프리셋) + sv.palette_key 있으면 선택 팔레트로 교체. 없는 템플릿은 found.palette 그대로(무회귀).
    let palette = (found && found.palette) || null;
    if (found && found.palettes) {
      const pk = sv.palette_key || found.defaultPaletteKey || 'default';
      palette = found.palettes[pk] || found.palette || palette;
    }
    const mainSlot = tpl && tpl.imageSlots && tpl.imageSlots.main_photo;
    const mainPhotoSrc = mainSlot && mainSlot.src;
    const mainPhoto = _slotImage(mainPhotoSrc);
    const data = { type: meta[0], kicker: meta[1], palette: palette,
      head: sv.headline || found.prefillText || meta[2],
      sub: sv.subtitle || meta[3],
      shop: sv.shop_name || b.shop,
      accent: (palette && palette.accent) || b.accent, price: b.price, review: sv.review_text || b.review,
      // [S2] 편집 가능 슬롯 추가 연결(없으면 undefined → 렌더러가 기존 동작 유지)
      services: sv.services, cta: sv.cta, phone: sv.phone, customer: sv.customer_label,
      serviceName: sv.service_name, reviewDate: sv.date,   // [HF1] review optional 라벨
      beforeLabel: sv.before_label, afterLabel: sv.after_label,
      // [ARCH-1] 아치형 전용 편집값(다른 템플릿은 undefined → 무회귀).
      categoryLabel: sv.category_label, shopHandle: sv.shop_handle,
      beforeCap: sv.before_caption, afterCap: sv.after_caption, mainPhoto: mainPhoto,
      // [S4] main_photo 위치/확대
      mainFocal: mainSlot && mainSlot.focal, mainZoom: mainSlot && mainSlot.zoom };
    if (meta[0] === 'baCompose' && window.PhotoEditorBACompose) {
      window.PhotoEditorBACompose.draw(ctx, dw, dh, state, tpl, data);
      return true;
    }
    // [BP-2] 뷰티 팩 위임 — 신규 id에서만 진입. 기존 경로(_draw/baCompose) 무회귀.
    if (meta[0] === 'beautyPack' && window.PhotoEditorBeautyPack) {
      window.PhotoEditorBeautyPack.draw(ctx, dw, dh, state, tpl, data);
      return true;
    }
    _draw(ctx, dw, dh, data);
    return true;
  }

  function _draw(ctx, w, h, d) {
    ctx.save();
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (d.mainPhoto) _drawCover(ctx, d.mainPhoto, 0, 0, w, h, d.mainFocal, d.mainZoom);
    if (d.type.startsWith('feed')) _drawFeed(ctx, w, h, d);
    else if (d.type.startsWith('story')) _drawStory(ctx, w, h, d);
    else if (d.type.startsWith('vertical')) _drawVertical(ctx, w, h, d);
    else if (d.type.startsWith('event')) _drawEvent(ctx, w, h, d);
    else if (d.type === 'priceTable') _drawPrice(ctx, w, h, d);
    else _drawCard(ctx, w, h, d);
    ctx.restore();
  }

  function _drawFeed(ctx, w, h, d) {
    _scrim(ctx, w, h, d.type === 'feedNotice' ? 0.44 : 0.34);

    if (d.type === 'feedReview') return _quoteCard(ctx, w, h, d);
    if (d.type === 'feedPrice') return _offerBand(ctx, w, h, d);

    _label(ctx, d.kicker, w * 0.11, h * 0.69, d.accent);
    _headline(ctx, d.head, w * 0.11, h * 0.77, w * 0.78, '#17181d', 0.055);

  function _drawStory(ctx, w, h, d) {
    _scrim(ctx, w, h, 0.42);

      _label(ctx, d.kicker, w * 0.1, h * 0.22, d.accent);

      _panel(ctx, w * 0.12, h * 0.34, w * 0.76, h * 0.22, PAL.cream, 28);
      _center(ctx, d.kicker, w / 2, h * 0.41, d.accent, 0.02, 700);
      _center(ctx, d.head, w / 2, h * 0.5, PAL.ink, 0.072, 900);
      _pill(ctx, w * 0.3, h * 0.61, w * 0.4, h * 0.055, d.sub, d.accent, '#fff');

  function _drawVertical(ctx, w, h, d) {
    _scrim(ctx, w, h, 0.36);
    if (d.type === 'verticalSplit') {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(2, w * 0.006);
      ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.5); ctx.lineTo(w * 0.88, h * 0.5); ctx.stroke();
      _pill(ctx, w * 0.09, h * 0.13, w * 0.32, h * 0.052, 'BEFORE', PAL.ink, '#fff');
      _pill(ctx, w * 0.59, h * 0.82, w * 0.32, h * 0.052, 'AFTER', d.accent, '#fff');

      _steps(ctx, w, h, d.accent);
    } else {
      _panel(ctx, w * 0.08, h * 0.37, w * 0.84, h * 0.22, 'rgba(255,250,242,0.94)', 24);

    _label(ctx, d.kicker, w * 0.1, h * 0.43, d.accent);
    _headline(ctx, d.head, w * 0.1, h * 0.52, w * 0.8, d.type === 'verticalSplit' ? '#fff' : PAL.ink, 0.058);
    _small(ctx, d.sub, w * 0.1, h * 0.6, d.type === 'verticalSplit' ? '#fff' : '#555');

  function _drawEvent(ctx, w, h, d) {
    ctx.fillStyle = d.type === 'eventMember' || d.type === 'eventDeadline' ? 'rgba(12,13,18,0.68)' : 'rgba(248,243,235,0.78)';
    ctx.fillRect(0, 0, w, h);
    if (d.type === 'eventNew') ctx.fillStyle = _grad(ctx, 0, 0, w, 0, d.accent, PAL.sage), ctx.fillRect(0, 0, w * 0.42, h);
    _panel(ctx, w * 0.11, h * 0.23, w * 0.78, h * 0.48, d.type === 'eventMember' || d.type === 'eventDeadline' ? 'rgba(17,18,23,0.82)' : PAL.cream, 26);
    _center(ctx, d.kicker, w / 2, h * 0.36, d.accent, 0.022, 800);

    _center(ctx, d.sub, w / 2, h * 0.61, d.type === 'eventMember' || d.type === 'eventDeadline' ? 'rgba(255,255,255,0.78)' : '#555', 0.024, 600);

  function _drawPrice(ctx, w, h, d) {
    if (d.palette) return _drawV3Price(ctx, w, h, d);   // [V3] palette 있으면 v3 전용(기존 무회귀)
    _scrim(ctx, w, h, 0.26);
    _panel(ctx, w * 0.07, h * 0.1, w * 0.86, h * 0.8, 'rgba(255,250,242,0.94)', 24);
    _label(ctx, d.kicker, w * 0.13, h * 0.2, d.accent);
    _headline(ctx, d.head, w * 0.13, h * 0.28, w * 0.72, PAL.ink, 0.044);

    const rows = _svcRows(d);
    const n = Math.max(rows.length, 1);
    const step = Math.min(0.09, 0.4 / n);
    rows.forEach((row, i) => {

    if (d.cta || d.phone) {
      _center(ctx, d.cta || '예약 문의', w / 2, h * 0.845, d.accent, 0.022, 800);
      if (d.phone) _center(ctx, d.phone, w / 2, h * 0.875, PAL.ink, 0.024, 700);
    } else {
      _small(ctx, d.shop, w * 0.14, h * 0.84, '#777');
    }
  }

  // [S2] 가격 행 — services(편집값) 우선, 없으면 kicker 프리셋. [name, price] 형태.
  function _svcRows(d) {
    const FT = window.PhotoEditorTemplateFitText;
    if (Array.isArray(d.services) && d.services.length) {
      return d.services
        .filter(s => s && (s.name || s.price))
        .slice(0, 5)
        .map(s => [s.name || '', s.price ? (FT ? FT.formatPrice(s.price) : s.price) : '']);
    }
    return _priceRows(d.kicker);
  }

  function _drawCard(ctx, w, h, d) {
    const dark = d.type === 'cardGold' || d.type === 'cardDark';
    const softBg = d.type === 'cardSoft' ? '#f1d8dd' : d.type === 'cardNature' ? '#e5eadf' : '#efe6d9';
    ctx.fillStyle = dark ? PAL.ink : softBg;
    ctx.fillRect(0, 0, w, h);
    if (!dark) {
      ctx.fillStyle = 'rgba(17,18,23,0.055)';
      ctx.fillRect(0, h * 0.78, w, h * 0.22);
      _frame(ctx, w, h, 'rgba(17,18,23,0.16)');
    }
    if (d.type === 'cardNature') _natureLine(ctx, w, h);
    if (d.type === 'cardGold') _frame(ctx, w, h, PAL.copper);
    if (d.type === 'cardSoft') _panel(ctx, w * 0.16, h * 0.34, w * 0.68, h * 0.28, PAL.cream, 24);
    const main = dark ? '#fff' : PAL.ink;
    _center(ctx, d.shop, w / 2, h * 0.46, main, 0.045, d.type === 'cardMinimal' ? 300 : 800);
    _center(ctx, d.head, w / 2, h * 0.57, d.accent, 0.024, 700);
    _center(ctx, d.sub, w / 2, h * 0.69, dark ? 'rgba(255,255,255,0.66)' : '#666', 0.02, 500);
  }

  function _bottomEditorial(ctx, w, h, d) {
    _label(ctx, d.kicker, w * 0.08, h * 0.71, d.accent);
    _headline(ctx, d.head, w * 0.08, h * 0.81, w * 0.84, '#fff', 0.065);
    _rule(ctx, w * 0.08, h * 0.86, w * 0.22, d.accent);

  function _quoteCard(ctx, w, h, d) {
    if (d.palette) return _drawV3Review(ctx, w, h, d);   // [V3] palette 있으면 v3 전용(기존 무회귀)
    const FT = window.PhotoEditorTemplateFitText;
    // [S2] 후기 본문(review)이 있으면 후기 카드 레이아웃, 없으면 기존(헤드+부제+샵).
    if (d.review && FT) {
      _panel(ctx, w * 0.08, h * 0.55, w * 0.84, h * 0.37, 'rgba(255,250,242,0.96)', 24);
      _label(ctx, d.kicker, w * 0.13, h * 0.62, d.accent);
      _headline(ctx, d.head, w * 0.13, h * 0.69, w * 0.74, PAL.ink, 0.036);
      FT.drawFitText(ctx, '“' + d.review + '”', { x: w * 0.13, y: h * 0.73, w: w * 0.74, h: h * 0.11 },
        { maxFontSize: Math.round(h * 0.026), minFontSize: Math.round(h * 0.017), maxLines: 3, lineHeight: 1.34, color: '#444', weight: 500, valign: 'top' });
      const foot = [d.customer || '', d.cta || ''].filter(Boolean).join('  ·  ') || (d.sub + ' · ' + d.shop);
      _small(ctx, foot, w * 0.13, h * 0.88, '#666');
      return;
    }
    _panel(ctx, w * 0.08, h * 0.6, w * 0.84, h * 0.28, 'rgba(255,250,242,0.96)', 24);
    _label(ctx, d.kicker, w * 0.13, h * 0.68, d.accent);
    _headline(ctx, d.head, w * 0.13, h * 0.76, w * 0.74, PAL.ink, 0.038);
    _small(ctx, d.sub + ' · ' + d.shop, w * 0.13, h * 0.83, '#666');
  }

  function _offerBand(ctx, w, h, d) {
    _panel(ctx, w * 0.07, h * 0.39, w * 0.86, h * 0.2, d.accent, 18);
    _center(ctx, d.kicker, w / 2, h * 0.46, 'rgba(255,255,255,0.78)', 0.018, 800);
    _center(ctx, d.head, w / 2, h * 0.54, '#fff', 0.065, 900);
    _brand(ctx, w, h, d);
  }

  function _noticeCard(ctx, w, h, d) {
    _panel(ctx, w * 0.1, h * 0.55, w * 0.8, h * 0.32, PAL.cream, 24);
    _label(ctx, d.kicker, w * 0.15, h * 0.64, d.accent);
    _headline(ctx, d.head, w * 0.15, h * 0.74, w * 0.7, PAL.ink, 0.038);
    _small(ctx, d.sub, w * 0.15, h * 0.81, '#666');
  }

  function _storyInteractive(ctx, w, h, d) {
    _label(ctx, d.kicker, w * 0.11, h * 0.29, d.accent);
    _headline(ctx, d.head, w * 0.11, h * 0.38, w * 0.78, '#fff', 0.042);
    if (d.type === 'storyCheck') for (let i = 0; i < 5; i++) _dot(ctx, w * (0.18 + i * 0.16), h * 0.53, w * 0.038, i < 3 ? d.accent : 'rgba(255,255,255,0.32)');
    else if (d.type === 'storyPoll') ['A STYLE', 'B STYLE'].forEach((x, i) => _pill(ctx, w * 0.15, h * (0.48 + i * 0.08), w * 0.7, h * 0.055, x, i ? PAL.cream : d.accent, i ? PAL.ink : '#fff'));
    else _panel(ctx, w * 0.13, h * 0.48, w * 0.74, h * 0.12, 'rgba(255,255,255,0.92)', 18), _center(ctx, '답변을 남겨주세요', w / 2, h * 0.55, '#777', 0.022, 600);
    _small(ctx, d.sub, w * 0.11, h * 0.68, 'rgba(255,255,255,0.82)');
  }

  function _steps(ctx, w, h, accent) {
    for (let i = 0; i < 4; i++) {
      const x = w * (0.18 + i * 0.21), y = h * 0.72;
      _dot(ctx, x, y, w * 0.04, accent);
      _center(ctx, String(i + 1), x, y + h * 0.01, '#fff', 0.024, 900);
      if (i < 3) _rule(ctx, x + w * 0.055, y, w * 0.11, 'rgba(255,255,255,0.6)');
    }
  }

  function _priceRows(k) {
    if (k.includes('NAIL')) return [['젤 원컬러', '50,000'], ['아트 추가', '10,000~'], ['케어', '25,000'], ['연장', '70,000~']];
    if (k.includes('LASH')) return [['펌', '55,000'], ['연장', '80,000'], ['리터치', '45,000'], ['제거', '10,000']];
    if (k.includes('MAKEUP')) return [['데일리', '60,000'], ['촬영', '120,000'], ['웨딩', '200,000'], ['속눈썹 추가', '15,000']];
    if (k.includes('WAX')) return [['브라질리언', '60,000'], ['페이스', '25,000'], ['바디', '50,000~'], ['진정 케어', '20,000']];
    return [['컷', '45,000'], ['펌', '180,000~'], ['컬러', '220,000~'], ['클리닉', '80,000~']];
  }

  // ── [V3] palette 기반 전용 렌더 (preview DOM 레이아웃을 canvas 로 모사) ──
  //   기존 _drawPrice/_quoteCard 는 미변경. palette 있을 때만 이 경로(무회귀).
  function _clip(ctx, text, maxW) {
    let s = String(text == null ? '' : text);
    if (ctx.measureText(s).width <= maxW) return s;
    while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
    return s + '…';
  }

  // [HF1] 원형 프로필 — 사진 있으면 원형 클립, 없으면 이니셜 원(accent 연한 배경).
  function _circleAvatar(ctx, img, cx, cy, r, accent) {
    if (img && (img.naturalWidth || img.width)) {
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
      _drawCover(ctx, img, cx - r, cy - r, r * 2, r * 2);
      ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = Math.max(1, r * 0.06); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke(); ctx.restore();
      return;
    }
    // 사진 없음 → 사람 실루엣(이니셜은 '30대' 등 나이 라벨에서 부정확하므로 실루엣 사용)
    ctx.save();
    ctx.fillStyle = accent; ctx.globalAlpha = 0.16; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = accent; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.18, r * 0.40, 0, Math.PI * 2); ctx.fill();      // 머리
    ctx.beginPath(); ctx.arc(cx, cy + r * 0.95, r * 0.75, 0, Math.PI * 2); ctx.fill();      // 어깨(clip 으로 하단만)
    ctx.globalAlpha = 1; ctx.restore();
  }

  function _drawV3Price(ctx, w, h, d) {
    const bg = _pal(d, 'bg', '#FBEFEF'), ink = _pal(d, 'ink', '#3A2C2C');
    const sub = _pal(d, 'sub', '#9A8585'), accent = _pal(d, 'accent', d.accent || '#C57E7E');
    const line = _pal(d, 'line', '#E7CFCF');
    const photo = d.mainPhoto;                 // 있으면 상단 밴드 유지(나머지 bg)
    const splitY = photo ? Math.round(h * 0.34) : 0;
    ctx.save();
    ctx.fillStyle = bg; ctx.fillRect(0, splitY, w, h - splitY);
    // 헤더
    let y = splitY + h * 0.085;
    ctx.textAlign = 'center';
    if (d.shop) { ctx.fillStyle = accent; ctx.font = `800 ${Math.round(h * 0.018)}px "Noto Sans KR", sans-serif`; ctx.fillText(_clip(ctx, String(d.shop).toUpperCase(), w * 0.8), w / 2, y); y += h * 0.05; }
    ctx.fillStyle = ink; ctx.font = `800 ${Math.round(h * 0.05)}px "Noto Serif KR", serif`; ctx.fillText(_clip(ctx, d.head || '시술 가격표', w * 0.84), w / 2, y); y += h * 0.038;
    if (d.sub) { ctx.fillStyle = sub; ctx.font = `500 ${Math.round(h * 0.02)}px "Noto Sans KR", sans-serif`; ctx.fillText(_clip(ctx, d.sub, w * 0.8), w / 2, y); }
    // [HF1] 서비스 행 — name+desc 2줄, badge pill, 정상가 취소선+이벤트가. 행 높이 고정(촘촘·상단정렬).
    const FT = window.PhotoEditorTemplateFitText;
    const badgeC = _pal(d, 'badge', accent);
    const svc = (Array.isArray(d.services) ? d.services : []).filter(s => s && (s.name || s.price)).slice(0, 5);
    const useSvc = svc.length ? svc : _svcRows(d).map(r => ({ name: r[0], price: r[1] }));
    const n = Math.max(useSvc.length, 1);
    const listTop = splitY + h * (photo ? 0.30 : 0.27);
    const listBottom = h * (d.cta || d.phone ? 0.82 : 0.92);
    const rowH = Math.min((listBottom - listTop) / n, h * 0.115);
    const LX = w * 0.12, RX = w * 0.88;
    useSvc.forEach((s, i) => {
      const ry = listTop + rowH * i;
      const cy = ry + rowH * 0.5;
      const hasDesc = !!s.desc;
      const nameY = hasDesc ? cy - rowH * 0.13 : cy;
      // name
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = ink;
      ctx.font = `700 ${Math.round(h * 0.024)}px "Noto Sans KR", sans-serif`;
      const nameStr = _clip(ctx, s.name || '', w * 0.40);
      ctx.fillText(nameStr, LX, nameY);
      // badge pill (name 우측)
      if (s.badge) {
        const nw = ctx.measureText(nameStr).width;
        const bf = Math.round(h * 0.014); ctx.font = `800 ${bf}px "Noto Sans KR", sans-serif`;
        const bt = String(s.badge).toUpperCase(); const bw = ctx.measureText(bt).width;
        const bx = LX + nw + w * 0.02, bpadX = w * 0.012, bh = h * 0.026;
        _panel(ctx, bx, nameY - bh / 2, bw + bpadX * 2, bh, badgeC, bh / 2);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(bt, bx + bpadX, nameY + bf * 0.05);
      }
      // desc
      if (hasDesc) {
        ctx.textAlign = 'left'; ctx.fillStyle = sub; ctx.font = `500 ${Math.round(h * 0.0165)}px "Noto Sans KR", sans-serif`;
        ctx.fillText(_clip(ctx, s.desc, w * 0.50), LX, cy + rowH * 0.20);
      }
      // price (정상가 취소선 + 이벤트가)
      const priceStr = s.price ? (FT ? FT.formatPrice(s.price) : s.price) : '';
      ctx.textAlign = 'right';
      if (s.origPrice) {
        const of = Math.round(h * 0.016); ctx.font = `500 ${of}px "Noto Sans KR", sans-serif`; ctx.fillStyle = sub;
        const ostr = FT ? FT.formatPrice(s.origPrice) : s.origPrice;
        const oy = nameY - rowH * 0.02; ctx.fillText(ostr, RX, oy);
        const ow = ctx.measureText(ostr).width; ctx.strokeStyle = sub; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(RX - ow, oy); ctx.lineTo(RX, oy); ctx.stroke();
        ctx.fillStyle = accent; ctx.font = `800 ${Math.round(h * 0.026)}px "Noto Sans KR", sans-serif`;
        ctx.fillText(_clip(ctx, priceStr, w * 0.34), RX, cy + rowH * 0.22);
      } else {
        ctx.fillStyle = accent; ctx.font = `800 ${Math.round(h * 0.026)}px "Noto Sans KR", sans-serif`;
        ctx.fillText(_clip(ctx, priceStr, w * 0.34), RX, cy);
      }
      // 구분선
      if (i < useSvc.length - 1) { ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(LX, ry + rowH); ctx.lineTo(RX, ry + rowH); ctx.stroke(); }
    });
    ctx.textBaseline = 'alphabetic';
    // CTA / phone
    ctx.textAlign = 'center';
    if (d.cta || d.phone) {
      if (d.cta) {
        const cw = w * 0.44, ch = h * 0.05, cx = w / 2 - cw / 2, cy = h * 0.885;
        _panel(ctx, cx, cy, cw, ch, accent, ch / 2);
        ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(h * 0.022)}px "Noto Sans KR", sans-serif`; ctx.textAlign = 'center';
        ctx.fillText(_clip(ctx, d.cta, cw * 0.85), w / 2, cy + ch * 0.66);
      }
      if (d.phone) { ctx.fillStyle = sub; ctx.font = `600 ${Math.round(h * 0.02)}px "Noto Sans KR", sans-serif`; ctx.fillText(d.phone, w / 2, h * 0.955); }
    }
    ctx.restore();
  }

  function _drawV3Review(ctx, w, h, d) {
    const bg = _pal(d, 'bg', '#FBEFEF'), ink = _pal(d, 'ink', '#3A2C2C');
    const sub = _pal(d, 'sub', '#9A8585'), accent = _pal(d, 'accent', d.accent || '#C57E7E');
    const FT = window.PhotoEditorTemplateFitText;
    ctx.save();
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    let y = h * 0.14;
    if (d.shop) { ctx.fillStyle = accent; ctx.font = `800 ${Math.round(h * 0.02)}px "Noto Sans KR", sans-serif`; ctx.fillText(_clip(ctx, String(d.shop).toUpperCase(), w * 0.8), w / 2, y); y += h * 0.05; }
    ctx.fillStyle = ink; ctx.font = `800 ${Math.round(h * 0.046)}px "Noto Serif KR", serif`; ctx.fillText(_clip(ctx, d.head || '고객님의 진심 후기', w * 0.84), w / 2, y); y += h * 0.042;
    if (d.sub) { ctx.fillStyle = sub; ctx.font = `500 ${Math.round(h * 0.021)}px "Noto Sans KR", sans-serif`; ctx.fillText(_clip(ctx, d.sub, w * 0.78), w / 2, y); y += h * 0.028; }
    // 별점
    ctx.fillStyle = '#FFB547'; ctx.font = `700 ${Math.round(h * 0.038)}px sans-serif`; ctx.fillText('★★★★★', w / 2, y + h * 0.038); y += h * 0.075;
    // [HF1] 인용 패널 — 흰 카드 + accent 좌측바 + 인용부호(회색 탈피·로즈 강조). 높이는 본문 길이 기반.
    const revText = String(d.review || '').slice(0, 120);
    const pX = w * 0.09, pW = w * 0.82;
    const pH = (revText.length > 48 ? h * 0.26 : h * 0.19);
    const pY = y;
    _panel(ctx, pX, pY, pW, pH, '#ffffff', 20);
    ctx.fillStyle = accent; ctx.fillRect(pX + w * 0.03, pY + pH * 0.2, Math.max(3, w * 0.008), pH * 0.6); // 좌측 강조바
    ctx.textAlign = 'left'; ctx.fillStyle = accent; ctx.font = `800 ${Math.round(h * 0.05)}px Georgia, "Noto Serif KR", serif`;
    ctx.fillText('“', pX + w * 0.06, pY + h * 0.055);
    if (FT && FT.drawFitText) {
      FT.drawFitText(ctx, revText, { x: pX + w * 0.08, y: pY + pH * 0.28, w: pW - w * 0.13, h: pH * 0.6 },
        { maxFontSize: Math.round(h * 0.024), minFontSize: Math.round(h * 0.017), maxLines: 4, lineHeight: 1.4, color: ink, weight: 500, valign: 'top' });
    } else {
      ctx.fillStyle = ink; ctx.font = `500 ${Math.round(h * 0.021)}px "Noto Sans KR", sans-serif`; ctx.fillText(_clip(ctx, revText, pW - w * 0.16), pX + w * 0.08, pY + pH * 0.55);
    }
    // [HF1] 프로필 + 작성자/시술명/날짜
    const ay = pY + pH + h * 0.05;
    const r = h * 0.032; const cx = pX + r + w * 0.01;
    _circleAvatar(ctx, d.mainPhoto, cx, ay, r, accent);
    const tx = cx + r + w * 0.035;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    if (d.customer) { ctx.fillStyle = ink; ctx.font = `700 ${Math.round(h * 0.02)}px "Noto Sans KR", sans-serif`; ctx.fillText(_clip(ctx, d.customer, w * 0.55), tx, ay - h * 0.012); }
    const meta = [d.serviceName, d.reviewDate].filter(Boolean).join('  ·  ');
    if (meta) { ctx.fillStyle = sub; ctx.font = `500 ${Math.round(h * 0.016)}px "Noto Sans KR", sans-serif`; ctx.fillText(_clip(ctx, meta, w * 0.55), tx, ay + h * 0.018); }
    ctx.textBaseline = 'alphabetic';
    // CTA
    if (d.cta) {
      const cw = w * 0.46, ch = h * 0.05, ccx = w / 2 - cw / 2, ccy = h * 0.9;
      _panel(ctx, ccx, ccy, cw, ch, accent, ch / 2);
      ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(h * 0.022)}px "Noto Sans KR", sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(_clip(ctx, d.cta, cw * 0.85), w / 2, ccy + ch * 0.66);
    }
    ctx.restore();
  }

  function _scrim(ctx, w, h, alpha) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, `rgba(8,9,12,${alpha * 0.52})`);
    g.addColorStop(0.52, `rgba(8,9,12,${alpha * 0.18})`);
    g.addColorStop(1, `rgba(8,9,12,${alpha})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  function _panel(ctx, x, y, w, h, color, r) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.26)';
    ctx.shadowBlur = Math.max(12, h * 0.08);
    ctx.shadowOffsetY = Math.max(4, h * 0.025);
    ctx.fillStyle = color;
    _rr(ctx, x, y, w, h, r);
    ctx.fill();
    ctx.restore();
  }

  function _brand(ctx, w, h, d) {
    ctx.textAlign = 'left';
    _small(ctx, d.shop, w * 0.08, h * 0.94, 'rgba(255,255,255,0.82)');
    _rule(ctx, w * 0.08, h * 0.9, w * 0.18, d.accent);
  }

  function _label(ctx, text, x, y, color) {
    ctx.textAlign = 'left'; ctx.fillStyle = color;
    ctx.font = `800 ${Math.round(Math.max(11, ctx.canvas.height * 0.018))}px sans-serif`;
    ctx.fillText(String(text).toUpperCase(), x, y);
  }

  function _headline(ctx, text, x, y, maxW, color, scale) {
    ctx.textAlign = 'left'; ctx.fillStyle = color;
    ctx.font = `900 ${Math.round(ctx.canvas.height * scale)}px sans-serif`;
    _fit(ctx, text, x, y, maxW, ctx.canvas.height * scale * 1.12, 2);
  }

  function _big(ctx, text, x, y, maxW, color, scale) {
    ctx.textAlign = 'left'; ctx.fillStyle = color;
    ctx.font = `900 ${Math.round(ctx.canvas.height * scale)}px sans-serif`;
    _fit(ctx, text, x, y, maxW, ctx.canvas.height * scale, 1);
  }

  function _small(ctx, text, x, y, color) {
    ctx.textAlign = 'left'; ctx.fillStyle = color;
    ctx.font = `600 ${Math.round(Math.max(12, ctx.canvas.height * 0.021))}px sans-serif`;
    ctx.fillText(text, x, y);
  }

  function _center(ctx, text, x, y, color, scale, weight) {
    ctx.textAlign = 'center'; ctx.fillStyle = color;
    ctx.font = `${weight || 700} ${Math.round(ctx.canvas.height * scale)}px sans-serif`;
    ctx.fillText(text, x, y);
  }

  function _pill(ctx, x, y, w, h, text, bg, fg) {
    ctx.fillStyle = bg; _rr(ctx, x, y, w, h, h / 2); ctx.fill();
    _center(ctx, text, x + w / 2, y + h * 0.64, fg, 0.02, 800);
  }

  function _rule(ctx, x, y, w, color) {
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, ctx.canvas.width * 0.004);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
  }

  function _dot(ctx, x, y, r, color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function _frame(ctx, w, h, color) {
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(3, w * 0.008);
    _rr(ctx, w * 0.08, h * 0.08, w * 0.84, h * 0.84, w * 0.04); ctx.stroke();
  }

  function _natureLine(ctx, w, h) {
    ctx.strokeStyle = PAL.sage; ctx.lineWidth = Math.max(2, w * 0.004);
    ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.32); ctx.bezierCurveTo(w * 0.36, h * 0.22, w * 0.6, h * 0.42, w * 0.88, h * 0.28); ctx.stroke();
  }

  function _fit(ctx, text, x, y, maxW, lineH, maxLines) {
    const words = String(text).split(/\s+/), lines = [];
    let cur = '';
    words.forEach(word => {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = word; } else cur = test;
    });
    if (cur) lines.push(cur);
    lines.slice(0, maxLines).forEach((line, i) => ctx.fillText(line, x, y + i * lineH));
  }

  function _grad(ctx, x0, y0, x1, y1, a, b) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, a); g.addColorStop(1, b);
    return g;
  }

  function _rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // [T1+T2 2026-06-06] 캔바식 갤러리로 통합 — "프리미엄 템플릿 30종" 별도 버튼 강제 노출 제거.
  //   렌더 hook(_premiumHook)·register 는 그대로 유지(적용·프리뷰 품질 동일).
  function _watchPanel() { _register(); }

  function _register() {
    const PE = window.PhotoEditor;
    if (!PE || !PE._internal || !PE._internal.registerDrawHook) return false;
    PE._internal.registerDrawHook('tplV2_overlay', _premiumHook);
    return true;
  }

  function _boot() {
    if (!_register()) setTimeout(_boot, 400);

/* 템플릿 실미리보기 썸네일 생성 (TPL-1 · 2026-06-02)

   목표: 템플릿 카드가 이름/배지만이 아니라 "실제 레이아웃이 보이는 썸네일"을 표시.
   - overlay 기반(사진 불필요·자체 렌더): PhotoEditorTemplateOverlay.draw(ctx,dw,dh,t,brand)
   - BA compose 기반(전후 2분할 등 사진 의존): PhotoEditorBACompose.draw(ctx,w,h,state,tpl,data)
       → 썸네일엔 코드로 그린 placeholder 살롱톤 더미사진 사용(실사진 자산 추가 0).
   - 둘 다 불가 시 null 반환 → 호출측이 기존 gradient 카드로 fallback.
   결과는 dataURL(PNG) 1회 생성 후 캐시. 실제 적용 draw 경로는 미변경(결과 동일). */
(function () {
  'use strict';
  if (window.PhotoEditorTemplateThumb) return;

  var _cache = {};   // id+ratio+accent → dataURL

  function _ratioWH(ratio, base) {
    if (ratio === '9:16') return { w: Math.round(base * 9 / 16), h: base };
    if (ratio === '1:1') return { w: base, h: base };
    return { w: Math.round(base * 4 / 5), h: base };   // 4:5 기본
  }
  // beautyPack 렌더러는 1080 기준 절대 px 폰트 사용 → 썸네일 작은 캔버스로 균등 축소.
  function _designWH(ratio) {
    if (ratio === '9:16') return { w: 1080, h: 1920 };
    if (ratio === '1:1') return { w: 1080, h: 1080 };
    return { w: 1080, h: 1350 };
  }

  // 코드 생성 placeholder "사진" — 실사진 아님. 살롱톤 그라데이션 + 부드러운 형태.
  function _placeholderPhoto(w, h, accent) {
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#f3e9ea'); g.addColorStop(1, accent || '#d8b6bd');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // 중앙 부드러운 원형(인물/시술 부위 근사)
    var rg = ctx.createRadialGradient(w * 0.5, h * 0.46, 2, w * 0.5, h * 0.46, w * 0.42);
    rg.addColorStop(0, 'rgba(255,255,255,0.5)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(w * 0.5, h * 0.46, w * 0.42, 0, Math.PI * 2); ctx.fill();
    return cv;
  }

  function _isBA(id) { return typeof id === 'string' && id.indexOf('ba-') === 0; }
  function _isBeautyPack(id) {
    var BP = window.PhotoEditorBeautyPack;
    return !!(BP && BP.has && BP.has(id));
  }

  // [WM] beautyPack(wm-/bp-) 템플릿용 data 매핑 — premium-templates 의 매핑과 동일 키.
  //   (드리프트 주의: premium _premiumHook 의 data 구성이 바뀌면 여기도 맞춰야 함.)
  function _beautyData(found, sv) {
    var pal = (found && found.palette) || null;
    return {
      type: 'beautyPack', kicker: (found && found.prefillText) || '', palette: pal,
      head: sv.headline || (found && (found.prefillText || found.label)) || '',
      sub: sv.subtitle, shop: sv.shop_name, accent: pal && pal.accent,
      services: sv.services, cta: sv.cta, phone: sv.phone,
      customer: sv.customer_label, serviceName: sv.service_name, review: sv.review_text,
      beforeLabel: sv.before_label, afterLabel: sv.after_label,
      beforeCap: sv.before_caption, afterCap: sv.after_caption,
    };
  }

  // 업로드 사진(opts.photo/beforePhoto)을 beautyPack/BA 렌더가 읽는 state 형태로.
  function _stateFromOpts(opts) {
    if (!opts || !opts.photo) return null;
    return { editedImg: opts.photo, originalImg: opts.photo, img: opts.photo, secondImg: opts.beforePhoto || opts.photo };
  }

  // 단일 템플릿 썸네일 dataURL 생성. 실패/미지원 시 null.
  //   tpl: {id,label,prefillText,accent,...}
  //   opts:{ ratio, accent(hex), shopName, logo, base, photo, beforePhoto, photoKey, noCache }
  function make(tpl, opts) {
    if (!tpl || !tpl.id) return null;
    opts = opts || {};
    var key = tpl.id + '|' + (opts.ratio || '') + '|' + (opts.accent || '') + '|' + (opts.photoKey || 'noimg');
    if (!opts.noCache && _cache[key]) return _cache[key];
    var base = opts.base || 320;
    var dim = _ratioWH(opts.ratio, base);
    var brand = { bg: opts.accent || '#c98a95', shopName: opts.shopName || '잇데이 스튜디오', logo: opts.logo || '' };
    var url = null;
    try {
      var cv = document.createElement('canvas'); cv.width = dim.w; cv.height = dim.h;
      var ctx = cv.getContext('2d');
      var state = _stateFromOpts(opts);
      if (_isBeautyPack(tpl.id)) {
        // wm-/bp- : 실제 beautyPack 렌더러로 — 업로드 사진 적용(없으면 렌더러가 placeholder 박스).
        var MD = window.PhotoEditorTemplateMarketData;
        var found = (MD && MD.lookupById && MD.lookupById(tpl.id)) || tpl;
        var TS = window.PhotoEditorTemplateSlots;
        var sv = (TS && TS.getDefaultValues) ? TS.getDefaultValues(tpl.id, found, { shopName: opts.shopName }) : {};
        var data = _beautyData(found, sv);
        var tplObj = { id: tpl.id, slotValues: sv, imageSlots: {} };
        // 1080 디자인 좌표로 그리고 썸네일 크기로 균등 축소(폰트/여백 비율 보존).
        var dz = _designWH(opts.ratio);
        ctx.save(); ctx.scale(dim.w / dz.w, dim.h / dz.h);
        window.PhotoEditorBeautyPack.draw(ctx, dz.w, dz.h, state, tplObj, data);
        ctx.restore();
      } else if (_isBA(tpl.id)) {
        if (!(window.PhotoEditorBACompose && window.PhotoEditorBACompose.draw)) return null;
        // 업로드 사진 있으면 그걸로, 없으면 코드 placeholder(살롱톤).
        if (!state) { var ph = _placeholderPhoto(dim.w, dim.h, opts.accent); ctx.drawImage(ph, 0, 0, dim.w, dim.h); }
        window.PhotoEditorBACompose.draw(ctx, dim.w, dim.h, state, tpl, {});
      } else {
        if (!(window.PhotoEditorTemplateOverlay && window.PhotoEditorTemplateOverlay.draw)) return null;
        if (state && state.editedImg) {   // 사진 있으면 배경으로 깔고 오버레이
          try { ctx.drawImage(state.editedImg, 0, 0, dim.w, dim.h); } catch (_e2) { void _e2; }
        }
        window.PhotoEditorTemplateOverlay.draw(ctx, dim.w, dim.h, tpl, brand);
      }
      url = cv.toDataURL('image/png');
    } catch (_e) { url = null; }
    if (url && !opts.noCache) _cache[key] = url;
    return url;
  }

  function supportKind(id) {
    if (_isBeautyPack(id)) return 'beautyPack';
    if (_isBA(id)) return (window.PhotoEditorBACompose && window.PhotoEditorBACompose.draw) ? 'ba' : 'fallback';
    return (window.PhotoEditorTemplateOverlay && window.PhotoEditorTemplateOverlay.draw) ? 'overlay' : 'fallback';
  }

  window.PhotoEditorTemplateThumb = { make, supportKind, _isBA };
})();
