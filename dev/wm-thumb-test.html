<!doctype html>
<meta charset="utf-8">
<title>WM Thumb (photo-applied) Test</title>
<style>
  body { margin:0; background:#6b6258; font-family:system-ui,sans-serif; padding:24px; }
  h1 { color:#fff; font-size:15px; }
  #status { color:#ffd; font-size:12px; white-space:pre-wrap; margin-bottom:12px; }
  .grid { display:flex; flex-wrap:wrap; gap:16px; }
  figure { margin:0; background:#fff; border-radius:8px; padding:6px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  figure img { display:block; width:220px; height:auto; border-radius:4px; background:#eee; }
  figcaption { font-size:11px; color:#333; text-align:center; margin-top:5px; max-width:220px; }
</style>
<h1>TH.make() — 업로드 사진 적용 썸네일 (wm 전후/후기/홍보/썸네일)</h1>
<div id="status">loading…</div>
<div class="grid" id="grid"></div>

<script src="../js/photo-editor/template-pack-beauty-data.js?t=2"></script>
<script src="../js/photo-editor/template-market-data.js?t=2"></script>
<script src="../js/photo-editor/template-slots.js?t=2"></script>
<script src="../js/photo-editor/template-fit-text.js?t=2"></script>
<script src="../js/photo-editor/template-renderer-beauty-pack.js?t=2"></script>
<script src="../js/photo-editor/template-renderer-beauty-pack-draws.js?t=2"></script>
<script src="../js/photo-editor/template-renderer-wm-pack-draws.js?t=2"></script>
<script src="../js/photo-editor/template-thumb.js?t=2"></script>
<script>
const CAT_RATIO = { ba:'4:5', feed:'4:5', price:'4:5', story:'9:16', card:'1:1', event:'1:1' };
const status = document.getElementById('status');
function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }

(async function(){
  const after = await loadImg('../output/qa-person.jpg');
  const before = await loadImg('../output/qa-person2.jpg');
  const TH = window.PhotoEditorTemplateThumb, MD = window.PhotoEditorTemplateMarketData;
  if(!TH){ status.textContent='ERR: thumb module missing'; return; }
  const ids = ['wm-ba-feed','wm-ba-story','wm-review-feed','wm-show-feed','wm-event-feed','wm-thumb-card'];
  const grid = document.getElementById('grid'); const errs=[];
  ids.forEach(id=>{
    const t = MD.lookupById(id); if(!t){ errs.push(id+': not found'); return; }
    const ratio = CAT_RATIO[t.cat] || '4:5';
    let url=null;
    try {
      url = TH.make(t, { ratio, accent:(t.palette&&t.palette.accent), shopName:'라보떼 살롱', base:440,
        photo: after, beforePhoto: before, photoKey:'qa1', noCache:true });
    } catch(e){ errs.push(id+': '+e.message); }
    const fig=document.createElement('figure');
    const img=document.createElement('img');
    if(url) img.src=url; else { img.alt='(null)'; errs.push(id+': make()→null'); }
    fig.appendChild(img);
    const cap=document.createElement('figcaption'); cap.textContent = id+' · kind='+TH.supportKind(id); fig.appendChild(cap);
    grid.appendChild(fig);
  });
  status.textContent = 'supportKind/render: ' + ids.map(id=>id+'='+TH.supportKind(id)).join(', ') + (errs.length? ('\nERRORS:\n'+errs.join('\n')) : '\nall thumbs generated');
  window.__done=true;
})();
</script>
