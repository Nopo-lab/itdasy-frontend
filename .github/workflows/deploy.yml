name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# [배포 안정화] Pages 배포는 한 번에 하나만 — 겹치는 실행이 같은 Pages 배포를 두고 경쟁하다
#   "Deployment failed, try again later" 나던 것 방지. 진행 중 배포는 취소하지 않고(중간 취소=깨짐) 큐잉.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Auto-bump app build version to commit SHA
        # 매 배포마다 SW/JS/HTML 빌드 버전을 함께 업데이트 → 구 캐시 자동 무효화
        run: |
          TS=$(date -u +'%Y%m%d-%H%M')
          SHA=${GITHUB_SHA::7}
          NEW_VERSION="${TS}-${SHA}"
          echo "🔄 Bumping app build → ${NEW_VERSION}"
          if [ -f sw.js ]; then
            sed -i.bak -E "s|const CACHE_VERSION = '[^']*';|const CACHE_VERSION = '${NEW_VERSION}';|" sw.js
            rm -f sw.js.bak
            echo "✅ sw.js updated"
            grep -m1 "CACHE_VERSION" sw.js
          else
            echo "⚠️ sw.js not found · 스킵"
          fi
          sed -i.bak -E "s|window.APP_BUILD = '[^']*';|window.APP_BUILD = '${NEW_VERSION}';|" app-core.js
          rm -f app-core.js.bak
          sed -i.bak -E "s|window.__LATEST_BUILD__ = '[^']*';|window.__LATEST_BUILD__ = '${NEW_VERSION}';|" index.html
          rm -f index.html.bak
      - name: Smoke check
        run: npm run smoke
      # [핫픽스] Pages 아티팩트에서 node_modules 제외 — 22k+ 파일이 Pages 파일 한도를 넘겨
      #   tokens.css·app-core.js 등 정상 파일이 무작위 404 나던 문제 근본 해결(런타임 미참조라 안전).
      #   .nojekyll 보장으로 Jekyll 처리에 의한 파일 누락도 방지.
      - name: Trim Pages artifact (drop node_modules, ensure .nojekyll)
        run: |
          rm -rf node_modules
          touch .nojekyll
          echo "files to publish: $(find . -type f -not -path './.git/*' | wc -l)"
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # [배포 안정화] GitHub Pages 백엔드가 배포 상태확인에서 간헐적으로 "try again later"를 뱉는다.
      #   아티팩트는 이미 1개 업로드됐으므로, 실패 시 같은 run 안에서 한 번 재배포(아티팩트 중복 없음).
      #   ⚠️ 이 재시도는 'rerun'과 다르다 — rerun은 아티팩트를 하나 더 올려 "Multiple artifacts" 오류를 낸다.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry Pages deploy once (GitHub 간헐 실패 자가치유)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
