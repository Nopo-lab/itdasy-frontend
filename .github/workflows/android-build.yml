name: Android Build (AAB + APK)

# 수동 실행 (Actions 탭에서 Run workflow) — main에 push할 때마다 빌드하면 낭비
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "빌드 종류"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # [2026-08-15] 운영 레포 capacitor.config.json 이 test-yeunjun Pages 를 가리킨 채로
      #   출시 직전까지 와 있었다. server.url 은 앱이 실제로 띄우는 사이트라, 틀리면
      #   "스토어에 올라간 앱이 테스트 사이트를 연다" 가 된다 — 심사 통과 후에야 드러난다.
      #   두 레포의 이 파일은 이 한 줄 빼고 동일해서 동기화 때 통째로 덮어쓰기 쉽다.
      #   그래서 사람 눈이 아니라 빌드가 막는다.
      - name: Guard — server.url 이 운영 Pages 인지
        run: |
          URL=$(python3 -c "import json;print(json.load(open('capacitor.config.json'))['server']['url'])")
          echo "server.url = $URL"
          if [ "$URL" != "https://nopo-lab.github.io/itdasy-frontend/" ]; then
            echo "::error::운영 빌드인데 server.url 이 운영 Pages 가 아닙니다: $URL"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android packages
        # variables.gradle 의 compileSdk 와 반드시 같이 움직인다. 34 만 깔려 있으면
        # "compile against version 35 or later" 로 빌드가 통째로 실패한다(2026-08-15 실측).
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Node + Capacitor
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      # google-services.json 은 .gitignore 로 레포에서 빠져 있다(보안감사 8bd456e 결정).
      # 레포가 public 이라 그 판단을 유지하고, 키스토어와 같은 방식으로 시크릿에서 주입한다.
      # 이 파일이 없으면 app/build.gradle:75 의 조건부 apply 가 플러그인을 건너뛰고,
      # 그 상태로 푸시를 등록하면 앱이 죽는다(FATAL: Default FirebaseApp is not initialized).
      # app-push.js 의 ANDROID_FIREBASE_READY 가 true 인 한, 여기서 반드시 성공해야 한다.
      - name: Inject google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret 누락 — 이대로 빌드하면 푸시 등록 시 앱이 죽는다"
            exit 1
          fi
          printf '%s' "$GS_JSON" > android/app/google-services.json
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));print('Firebase project =',d['project_info']['project_id']);print('packages =',[c['client_info']['android_client_info']['package_name'] for c in d['client']])"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Gradle permission
        working-directory: android
        run: chmod +x gradlew

      # ── Debug APK 경로 ────────────────────────────────────
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── Release AAB 서명 파이프라인 ────────────────────────
      # GitHub Secrets 필요:
      #   ANDROID_KEYSTORE_BASE64  : base64 -i keystore.jks 결과
      #   ANDROID_KEYSTORE_PASSWORD: 키스토어 마스터 비번
      #   ANDROID_KEY_ALIAS        : 키 alias (예: itdasy)
      #   ANDROID_KEY_PASSWORD     : 키 비번
      - name: Decode keystore
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret 누락 — keystore 먼저 등록해주세요"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/itdasy-release.jks
          echo "Keystore decoded ($(stat -c%s android/app/itdasy-release.jks 2>/dev/null || stat -f%z android/app/itdasy-release.jks) bytes)"

      - name: Inject signing config
        if: ${{ inputs.build_type == 'release' }}
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('itdasy-release.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release AAB (signed)
        if: ${{ inputs.build_type == 'release' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 빌드 번호에 묶어 자동 증가 — Play 는 versionCode 재사용을 거부한다.
          # (근거는 android/app/build.gradle 의 versionCode 주석)
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      - name: 빌드된 versionCode 확인
        if: ${{ inputs.build_type == 'release' }}
        run: |
          echo "이번 AAB 의 versionCode = ${{ github.run_number }}"
          echo "다음 업로드는 이보다 큰 값이어야 합니다."

      # ── 산출물 업로드 ───────────────────────────────────
      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: itdasy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: itdasy-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
