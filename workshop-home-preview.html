<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업실 홈 미리보기 · 실데이터</title>
<style>
  :root{
    --brand:#D58A95; --brand-strong:#BC6675; --brand-bg:#F7EFF0;
    --bg:#FBFBFC; --surface:#FFF; --surface-2:#F4F5F7;
    --text:#191F28; --text-muted:#4E5968; --text-subtle:#8A939F;
    --border:rgba(0,0,0,.055);
    --ok:#12B886; --warn:#F59F00;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:26px; --r-pill:999px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#E5E8EB;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;display:flex;justify-content:center;padding:40px 24px;min-height:100vh;}
  .phone{width:378px;background:var(--bg);border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column;height:812px;position:relative;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:44px 20px 8px;flex-shrink:0;}
  .top__wm{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.2px;}
  .top__wm b{color:var(--brand);}
  .top__ava{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--text-muted);display:grid;place-items:center;font-size:12px;font-weight:700;}
  .scr{flex:1;overflow-y:auto;}
  .scr::-webkit-scrollbar{display:none;}

  /* 입력창 히어로 */
  .cBar{margin:14px 18px 6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:16px 16px 14px;box-shadow:0 4px 18px rgba(0,0,0,.05);}
  .cBar__row{display:flex;align-items:center;gap:11px;}
  .cBar__bot{width:38px;height:38px;border-radius:12px;background:var(--brand-bg);color:var(--brand-strong);display:grid;place-items:center;flex-shrink:0;}
  .cBar__ph{flex:1;font-size:14.5px;color:var(--text-subtle);}
  .cBar__acts{display:flex;gap:8px;margin-top:14px;}
  .cBar__cam{flex:1;height:46px;border:none;border-radius:14px;background:var(--text);color:#fff;font-family:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;}
  .cBar__mini{width:46px;height:46px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text-muted);display:grid;place-items:center;cursor:pointer;}

  /* 벤토 타일 (대시보드) */
  .bento{padding:12px 16px 4px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:104px;gap:11px;}
  .tile{border-radius:var(--r-lg);padding:15px;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border);background:var(--surface);}
  .tile__lbl{font-size:13px;font-weight:700;color:var(--text-muted);}
  /* 이어서 — 세로 2행 썸네일 */
  .t-resume{grid-row:span 2;color:#fff;border-color:transparent;background-size:cover;background-position:center;}
  .t-resume::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.1),rgba(0,0,0,.62));}
  .t-resume>*{position:relative;z-index:1;}
  .t-resume .tr__lbl{font-size:12px;font-weight:700;color:rgba(255,255,255,.9);}
  .t-resume .tr__t{font-size:17px;font-weight:800;color:#fff;}
  .t-resume .tr__s{font-size:11.5px;color:rgba(255,255,255,.85);margin-top:3px;}
  .t-resume .tr__go{position:absolute;right:0;bottom:0;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--text);display:grid;place-items:center;}
  /* 성과 */
  .t-stat .ts__n{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.5px;}
  .t-stat .ts__n b{font-size:14px;color:var(--ok);font-weight:700;margin-left:4px;}
  /* 글만 쓰기 */
  .t-quick .tq__ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--text-muted);display:grid;place-items:center;}
  .t-quick .tq__t{font-size:14px;font-weight:700;color:var(--text);}
  .t-quick .tq__s{font-size:11.5px;color:var(--text-subtle);margin-top:2px;}

  /* 내 콘텐츠 그리드 */
  .cSec{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 0;}
  .cSec h2{font-size:17px;font-weight:800;color:var(--text);}
  .cSec small{font-size:12.5px;color:var(--text-subtle);font-weight:600;}
  .cFilter{display:flex;gap:7px;padding:14px 20px 14px;}
  .cFilter button{border:none;font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--text-muted);cursor:pointer;}
  .cFilter button.on{background:var(--text);color:#fff;}
  .cGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 16px 96px;}
  .cGrid__empty{grid-column:1/-1;text-align:center;color:var(--text-subtle);font-size:13px;font-weight:600;padding:34px 0;}
  .gCell{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2);background-size:cover;background-position:center;cursor:pointer;}
  .gCell::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 58%,rgba(0,0,0,.34));}
  .gTag{position:absolute;left:7px;bottom:7px;font-size:10.5px;font-weight:700;color:#fff;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.35);}
  .gDot{position:absolute;top:8px;left:8px;width:7px;height:7px;border-radius:50%;z-index:1;box-shadow:0 0 0 2px rgba(255,255,255,.55);}
  .gDot--wait{background:var(--text-subtle);}
  .gDot--edit{background:var(--brand);}
  .gDot--ready{background:var(--warn);}
  .gDot--done{background:var(--ok);}
  .gGo{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--text);display:grid;place-items:center;z-index:1;}

  /* 데이터 출처 배지 */
  .srcBadge{margin:2px 18px 0;font-size:11px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:5px;}
  .srcBadge--real{background:#E6F7F0;color:#0C8A5F;}
  .srcBadge--demo{background:#FFF4E0;color:#B4770B;}

  /* 하단바 */
  .nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 26px 12px;}
  .nav__it{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-subtle);font-size:11px;font-weight:600;}
  .nav__it.on{color:var(--text);}
  .nav__c{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-12px;box-shadow:0 6px 16px rgba(213,138,149,.4);}
</style>
</head>
<body>
<div class="phone">
  <div class="top"><div class="top__wm">Itda<b>sy</b></div><div class="top__ava" id="ava">D</div></div>
  <div class="scr">

    <!-- 벤토 타일 (동적) -->
    <div class="bento" id="bento"></div>

    <!-- 입력창 -->
    <div class="cBar">
      <div class="cBar__row">
        <span class="cBar__bot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v1H7a2 2 0 0 0-2 2v3a4 4 0 0 0 4 4h6a4 4 0 0 0 4-4V8a2 2 0 0 0-2-2h-2V5a3 3 0 0 0-3-3z"/><path d="M9 20h6"/></svg></span>
        <span class="cBar__ph">사진 올리거나, 만들고 싶은 걸 말해요</span>
      </div>
      <div class="cBar__acts">
        <button class="cBar__cam"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>사진 올리기</button>
      </div>
    </div>

    <!-- 데이터 출처 표시 -->
    <div><span class="srcBadge" id="srcBadge"></span></div>

    <!-- 내 콘텐츠 그리드 -->
    <div class="cSec">
      <h2>내 콘텐츠</h2>
      <small id="cCount">전체 0개</small>
    </div>
    <div class="cFilter" id="cFilter">
      <button class="on" data-filter="all">전체</button>
      <button data-filter="progress">진행 중</button>
      <button data-filter="done">완료</button>
    </div>
    <div class="cGrid" id="cGrid"></div>
  </div>
  <div class="nav">
    <div class="nav__it on"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>홈</div>
    <div class="nav__c"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
    <div class="nav__it"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5M4 9v11h16V9"/></svg>내 샵 관리</div>
  </div>
</div>

<script>
/* 작업실 홈 미리보기 — 실제 작업실 슬롯(IndexedDB itdasy-gallery/slots)을 읽어 렌더.
   * 데이터가 있으면(배포 사이트 등 실제 앱과 같은 오리진) 실데이터로,
   * 없으면(로컬/신규) 데모 데이터로 폴백해 항상 보이게 한다. */
(function () {
  'use strict';
  var DB_NAME = 'itdasy-gallery', STORE = 'slots';
  var GO = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
  var GO_BIG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
  var DEMO_GRAD = ['linear-gradient(145deg,#E8D8CE,#C9AE9E)','linear-gradient(145deg,#F2DDE0,#D9AEB6)','linear-gradient(145deg,#DCE1DC,#B4BFB6)','linear-gradient(145deg,#E4D5CB,#B99D8C)','linear-gradient(145deg,#EBD3D6,#C79AA2)','linear-gradient(145deg,#E9D9D0,#C2A594)'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function loadSlots() {
    return new Promise(function (resolve) {
      var req;
      try { req = indexedDB.open(DB_NAME); } catch (e) { return resolve(null); }
      req.onerror = function () { resolve(null); };
      req.onsuccess = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) { resolve([]); return; }
        try {
          var tx = db.transaction(STORE, 'readonly');
          var rq = tx.objectStore(STORE).getAll();
          rq.onsuccess = function () { resolve((rq.result || []).sort(function (a, b) { return (b.order || 0) - (a.order || 0); })); };
          rq.onerror = function () { resolve([]); };
        } catch (e) { resolve([]); }
      };
    });
  }

  // 슬롯 상태 → 미리보기 점/라벨
  function statusOf(s) {
    var photos = (s.photos || []).filter(function (p) { return !p.hidden; });
    if (s.status === 'done' || s.status === 'published') return { k: 'done', tag: '완료', progress: false };
    if (photos.length && (s.caption || s.previewUrl)) return { k: 'ready', tag: '업로드 준비', progress: true };
    if (photos.length) return { k: 'edit', tag: '편집 중', progress: true };
    return { k: 'wait', tag: '업로드 대기', progress: true };
  }
  function thumbOf(s) {
    var p = (s.photos || []).filter(function (x) { return !x.hidden; })[0];
    return p ? (p.editedDataUrl || p.dataUrl || '') : '';
  }
  function photoCount(s) { return (s.photos || []).filter(function (p) { return !p.hidden; }).length; }
  function isSameMonth(ts) {
    if (!ts) return false; var d = new Date(ts), n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
  }

  var _state = { slots: [], filter: 'all' };

  function renderBento() {
    var slots = _state.slots;
    var resume = slots.filter(function (s) { var st = statusOf(s); return st.progress; })[0];
    var thisMonth = slots.filter(function (s) { return (s.status === 'done' || s.status === 'published') && isSameMonth(s.updatedAt || s.createdAt); }).length;

    var resumeHtml;
    if (resume) {
      var th = thumbOf(resume), st = statusOf(resume), cnt = photoCount(resume);
      var bg = th ? ('url(' + th + ')') : 'linear-gradient(150deg,#D58A95,#7C4A54)';
      resumeHtml =
        '<div class="tile t-resume" style="background-image:' + bg + '">' +
          '<div class="tr__lbl">이어서 하기</div>' +
          '<div><div class="tr__t">' + esc(resume.label || '무제 작업') + '</div>' +
            '<div class="tr__s">' + esc(st.tag) + (cnt ? ' · ' + cnt + '장' : '') + '</div></div>' +
          '<span class="tr__go">' + GO_BIG + '</span>' +
        '</div>';
    } else {
      resumeHtml =
        '<div class="tile t-resume" style="background-image:linear-gradient(150deg,#D58A95,#7C4A54)">' +
          '<div class="tr__lbl">시작하기</div>' +
          '<div><div class="tr__t">첫 작업 만들기</div><div class="tr__s">사진을 올려보세요</div></div>' +
          '<span class="tr__go">' + GO_BIG + '</span>' +
        '</div>';
    }

    document.getElementById('bento').innerHTML =
      resumeHtml +
      '<div class="tile t-stat"><span class="tile__lbl">이번 달 발행</span>' +
        '<div class="ts__n">' + thisMonth + (thisMonth > 0 ? '<b>&#9650;</b>' : '') + '</div></div>' +
      '<div class="tile t-quick">' +
        '<span class="tq__ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>' +
        '<div><div class="tq__t">글만 쓰기</div><div class="tq__s">사진 없이 캡션만</div></div>' +
      '</div>';
  }

  function renderGrid() {
    var slots = _state.slots, f = _state.filter;
    var filtered = slots.filter(function (s) {
      var done = (s.status === 'done' || s.status === 'published');
      if (f === 'done') return done;
      if (f === 'progress') return !done;
      return true;
    });
    var grid = document.getElementById('cGrid');
    if (!filtered.length) {
      grid.innerHTML = '<div class="cGrid__empty">' + (slots.length ? '이 필터에 해당하는 작업이 없어요' : '아직 만든 콘텐츠가 없어요') + '</div>';
      return;
    }
    grid.innerHTML = filtered.map(function (s, i) {
      var st = statusOf(s), th = thumbOf(s);
      var bgStyle = th ? ('background-image:url(' + th + ')') : ('background-image:' + DEMO_GRAD[i % DEMO_GRAD.length]);
      var go = st.k === 'done' ? '' : '<span class="gGo">' + GO + '</span>';
      return '<div class="gCell" style="' + bgStyle + '">' +
        '<span class="gDot gDot--' + st.k + '"></span>' + go +
        '<span class="gTag">' + esc(st.tag) + '</span></div>';
    }).join('');
  }

  function renderCount() {
    document.getElementById('cCount').textContent = '전체 ' + _state.slots.length + '개';
  }

  function renderAll() { renderBento(); renderGrid(); renderCount(); }

  // 데모 슬롯(폴백) — 실데이터 없을 때만
  function demoSlots() {
    var now = Date.now();
    return [
      { label: '봄 이벤트 컷', status: 'open', photos: [{ dataUrl: '' }], caption: '봄 신상', updatedAt: now, order: 6 },
      { label: '레이어드컷 후기', status: 'open', photos: [{ dataUrl: '' }], updatedAt: now, order: 5 },
      { label: '네일 신상', status: 'open', photos: [], updatedAt: now, order: 4 },
      { label: '왁싱 전후', status: 'done', photos: [{ dataUrl: '' }], updatedAt: now, order: 3 },
      { label: '속눈썹 리터치', status: 'done', photos: [{ dataUrl: '' }], updatedAt: now, order: 2 },
      { label: '펌 완성', status: 'published', photos: [{ dataUrl: '' }], updatedAt: now, order: 1 }
    ];
  }

  document.getElementById('cFilter').addEventListener('click', function (e) {
    var b = e.target.closest('[data-filter]'); if (!b) return;
    _state.filter = b.getAttribute('data-filter');
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
    renderGrid();
  });

  // 아바타/상호 이니셜
  try { var sn = localStorage.getItem('shop_name'); if (sn && sn.trim()) document.getElementById('ava').textContent = sn.trim().charAt(0).toUpperCase(); } catch (e) {}

  loadSlots().then(function (slots) {
    var badge = document.getElementById('srcBadge');
    if (slots && slots.length) {
      _state.slots = slots;
      badge.className = 'srcBadge srcBadge--real';
      badge.textContent = '● 실제 작업실 데이터 ' + slots.length + '건';
    } else {
      _state.slots = demoSlots();
      badge.className = 'srcBadge srcBadge--demo';
      badge.textContent = '● 데모 데이터 (이 브라우저에 저장된 작업실 슬롯이 없어요 — 배포 앱에서 열면 실데이터)';
    }
    renderAll();
  });
})();
</script>
</body>
</html>
